<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 280px;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    color: #e0e0e0;
    background: #1a1a2e;
    padding: 16px;
  }
  h3 {
    font-size: 15px;
    margin-bottom: 14px;
    color: #fff;
  }
  label {
    display: block;
    margin-bottom: 4px;
    font-weight: 500;
    color: #aaa;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  select, input[type="number"] {
    width: 100%;
    padding: 6px 8px;
    margin-bottom: 12px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #16213e;
    color: #e0e0e0;
    font-size: 13px;
  }
  input[type="range"] {
    width: 100%;
    margin-bottom: 12px;
    accent-color: #e94560;
  }
  .speed-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .speed-row input { flex: 1; margin-bottom: 0; }
  .speed-val {
    min-width: 32px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #status {
    margin-top: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12px;
    text-align: center;
  }
  .ok { background: #0a3d1e; color: #6fcf97; }
  .err { background: #3d0a0a; color: #f09696; }
</style>
</head>
<body>
  <h3>Read Aloud</h3>

  <label>Backend</label>
  <select id="backend"></select>

  <label>Voice</label>
  <select id="voice"></select>

  <label>Speed</label>
  <div class="speed-row">
    <input type="range" id="speed" min="0.5" max="2.0" step="0.1" value="1.0">
    <span class="speed-val" id="speed-val">1.0</span>
  </div>

  <label>Port</label>
  <input type="number" id="port" value="7852" min="1024" max="65535">

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
