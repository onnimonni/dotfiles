[project]
name = "read-aloud-tts"
version = "0.1.0"
description = "Local TTS server with multiple backends for the Read Aloud browser extension"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
kokoro = [
    "kokoro-onnx>=0.5.0",
    "onnxruntime>=1.20",
    "soundfile>=0.13",
]
piper = [
    "piper-tts>=1.2",
]
orpheus = [
    "httpx>=0.28",
    "snac>=1.2",
    "torch>=2.0",
]
all = [
    "read-aloud-tts[kokoro,piper,orpheus]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
